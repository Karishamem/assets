<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marck+Script&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: a single paper column on a wisteria-lavender ground, built from stacked cream and olive panels
   (like a folded invitation); a sealed envelope opens to reveal it. */
:root {
  --wisteria: #e4def0;
  --paper: #fbf7ee;
  --paper-edge: #efe7d6;
  --olive: #7c8257;
  --olive-deep: #5f6542;
  --ink: #4b4a36;
  --ink-soft: #7a7860;
  --gold: #a58a52;
  --blush: #d98f9a;
  --on-olive: #fbf7ee;
  --font-script: "Marck Script", "Segoe Script", cursive;
  --font-serif: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --font-label: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 10% 0%, rgba(185,174,214,.75), transparent 45%),
    radial-gradient(ellipse at 95% 15%, rgba(185,174,214,.55), transparent 40%),
    radial-gradient(ellipse at 50% 100%, rgba(196,212,178,.6), transparent 55%),
    var(--wisteria);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 1.15rem;
  line-height: 1.55;
  font-variant-numeric: lining-nums;
  padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  overflow-x: hidden;
}
#petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.stage { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; }

/* ---------- Envelope ---------- */
.envelope-wrap { display: grid; place-items: center; align-content: center; min-height: calc(100vh - 56px); gap: 26px; padding-top: 70px; }
.envelope {
  position: relative; width: min(100%, 420px); aspect-ratio: 420 / 290; max-width: 100%;
  border: 0; padding: 0; background: none; cursor: pointer; font: inherit; color: inherit;
  perspective: 1200px; filter: drop-shadow(0 22px 26px rgba(60,50,70,.28)) drop-shadow(0 3px 4px rgba(60,50,70,.18));
  transition: transform .4s ease;
}
.envelope:hover { transform: translateY(-3px) rotate(-.4deg); }
.envelope:focus-visible { outline: 2px solid var(--gold); outline-offset: 8px; border-radius: 6px; }
.envelope > * { position: absolute; display: block; }
.env-back, .env-front, .flap { inset: 0; width: 100%; height: 100%; }
.env-back { z-index: 0; }
.letter {
  left: 5%; right: 5%; top: 5%; height: 88%; z-index: 1;
  background: var(--paper); border-radius: 2px;
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
  display: grid; place-items: center; align-content: start; padding-top: 7%; gap: 2px;
  transition: transform 1s cubic-bezier(.3,.7,.2,1);
}
.letter::before {
  content: ""; position: absolute; inset: 8px; border: 1px solid rgba(165,138,82,.45); border-radius: 1px;
}
.letter small { font-family: var(--font-label); font-size: .6rem; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); }
.letter b { font-family: var(--font-script); font-weight: 400; font-size: clamp(1.2rem, 5vw, 1.6rem); color: var(--olive-deep); }
.env-front { z-index: 2; pointer-events: none; }
.flap { z-index: 3; transform-origin: top center; transition: transform .7s cubic-bezier(.55,.05,.35,1); pointer-events: none; }
.seal {
  z-index: 4; left: 50%; top: 57%; width: 23%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(-8deg);
  transition: opacity .35s ease, transform .35s ease;
}
.seal svg { width: 100%; height: 100%; display: block; overflow: visible; }
.envelope-to {
  z-index: 4; left: 10%; right: 10%; bottom: 6%; text-align: center; transition: opacity .3s ease;
}
.envelope-to small {
  display: block; font-family: var(--font-label); font-size: .62rem; letter-spacing: .24em;
  text-transform: uppercase; color: var(--ink-soft);
}
.envelope-to span { font-family: var(--font-script); font-size: clamp(1.1rem, 4.6vw, 1.45rem); line-height: 1.15; color: #3f3d2c; }
.hint {
  margin: 0; display: flex; align-items: center; gap: 8px;
  font-family: var(--font-label); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase;
  color: var(--olive-deep); animation: breathe 2.4s ease-in-out infinite;
}
.hint svg { width: 18px; height: 18px; }
@keyframes breathe { 50% { opacity: .45; } }
body.opening .seal { opacity: 0; transform: translate(-50%, -30%) rotate(-8deg) scale(.7); }
body.opening .envelope-to { opacity: 0; }
body.opening .flap { transform: rotateX(178deg); }
body.opening .hint { visibility: hidden; }
body.pulling .flap { z-index: 0; }
body.pulling .letter { transform: translateY(-62%); }
body.leaving .envelope-wrap { animation: sink .6s ease forwards; }
@keyframes sink { to { opacity: 0; transform: translateY(24px) scale(.97); } }

/* ---------- Invitation column ---------- */
.card {
  background: var(--paper); border-radius: 14px; overflow: hidden; text-align: center;
  box-shadow: 0 30px 60px -30px rgba(75,74,54,.55), 0 2px 8px rgba(75,74,54,.08);
}
body.sealed .card { display: none; }
body.revealed .envelope-wrap { display: none; }
body.revealed .card { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

.panel { padding: 44px clamp(20px, 7vw, 44px); display: grid; gap: 16px; justify-items: center; position: relative; }
.panel:not(.olive) + .panel:not(.olive)::before {
  content: ""; position: absolute; top: 0; left: 50%; width: 120px; margin-left: -60px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.panel.olive { background: var(--olive); color: var(--on-olive); padding-block: 52px; }
/* lace scallops on the edges of olive panels */
.panel.olive::before, .panel.olive::after {
  content: ""; position: absolute; left: 0; right: 0; height: 12px;
  background: radial-gradient(circle at 9px 0, var(--paper) 8.5px, transparent 9px) 0 0 / 18px 12px repeat-x;
}
.panel.olive::before { top: 0; }
.panel.olive::after { bottom: 0; transform: scaleY(-1); }
.panel > * { margin: 0; max-width: 100%; min-width: 0; }

h2 {
  font-family: var(--font-script); font-weight: 400; font-size: clamp(1.9rem, 7.5vw, 2.4rem);
  line-height: 1.15; color: var(--olive-deep); text-wrap: balance;
}
.olive h2 { color: var(--on-olive); }
.text { max-width: 32ch; text-wrap: pretty; }
.text p { margin: 0 0 .7em; }
.text p:last-child { margin: 0; }
.muted { color: var(--ink-soft); font-style: italic; }
.flourish { width: 150px; height: 22px; color: var(--gold); }

/* hero */
.hero { padding-block: 30px 36px; background: radial-gradient(ellipse at 50% 40%, #fffdf7, var(--paper) 60%, var(--paper-edge)); }
.lace { position: relative; width: min(100%, 320px); aspect-ratio: 320 / 400; display: grid; place-items: center; }
.lace svg.frame { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--gold); }
.lace .inner { position: relative; display: grid; gap: 2px; justify-items: center; padding: 0 17% 6%; }
.lace .kicker { margin: 0; font-family: var(--font-serif); font-size: 1.3rem; line-height: 1.1; color: var(--ink); }
.lace .kicker small { display: block; font-family: var(--font-script); font-size: .95rem; color: var(--ink-soft); }
.lace .couple { margin: 12px 0 10px; font-family: var(--font-script); font-weight: 400; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.05; color: var(--olive-deep); overflow-wrap: anywhere; }
.lace .date { margin: 0; font-family: var(--font-serif); font-size: 1.25rem; letter-spacing: .1em; }
.lace .date i { font-style: normal; color: var(--gold); padding: 0 .3em; }

/* greeting */
.medallion { width: 64px; height: 64px; color: var(--gold); }
.greeting { font-family: var(--font-script); font-weight: 400; font-size: clamp(1.9rem, 7.5vw, 2.4rem); line-height: 1.15; color: var(--olive-deep); text-wrap: balance; overflow-wrap: anywhere; }
.greeting small { display: block; font-size: .7em; color: var(--ink-soft); }

/* calendar strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; max-width: 340px; row-gap: 4px; }
.week span { font-family: var(--font-script); font-size: 1.1rem; color: var(--ink-soft); }
.week b { font-family: var(--font-serif); font-weight: 500; font-size: 1.2rem; position: relative; display: grid; place-items: center; height: 42px; }
.week b.on { color: #fff; }
.week b.on svg { position: absolute; width: 42px; height: 42px; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--blush); }
.week b.on em { position: relative; font-style: normal; }

/* countdown */
.units { display: flex; justify-content: center; align-items: flex-start; gap: 2px; }
.unit { min-width: 56px; display: grid; }
.num { font-size: 2.5rem; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums lining-nums; }
.sep { font-size: 2.1rem; line-height: 1.1; opacity: .7; }
.lbl { font-family: var(--font-label); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.cd-done { font-family: var(--font-script); font-size: 2rem; }

/* programme */
.program { list-style: none; padding: 0; width: 100%; max-width: 360px; display: grid; }
.program li { display: grid; grid-template-columns: 52px 1px 1fr; column-gap: 16px; text-align: left; }
.program .ico { width: 52px; height: 52px; color: var(--gold); }
.program .rail { background: var(--gold); opacity: .45; margin-block: 4px; }
.program li:last-child .rail { opacity: 0; }
.program .what { padding-bottom: 26px; min-width: 0; }
.program .head { display: grid; gap: 0; }
.program .head b { font-family: var(--font-script); font-weight: 400; font-size: 1.55rem; line-height: 1.1; color: var(--olive-deep); }
.program .head time { order: -1; font-family: var(--font-label); font-size: .8rem; letter-spacing: .14em; color: var(--gold); font-variant-numeric: tabular-nums lining-nums; }
.program .what p { margin: 4px 0 0; color: var(--ink-soft); font-size: 1.05rem; line-height: 1.45; }

/* location */
.place-name { font-size: 1.3rem; font-weight: 600; }
.venue-photo { width: 100%; border-radius: 2px; display: block; }

.btn {
  display: inline-block; border: 0; border-radius: 999px; padding: 12px 28px;
  font-family: var(--font-label); font-size: .74rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--on-olive); background: var(--olive); text-decoration: none; cursor: pointer;
  transition: background .2s;
}
.btn:hover, .btn:focus-visible { background: var(--olive-deep); outline: none; }
.btn:active, .chip:active span, .socials a:active { transform: scale(.98); }
.rsvp ::placeholder { color: #8d8a73; opacity: 1; }
.btn:focus-visible { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--gold); }
.btn.ghost { background: transparent; color: var(--olive-deep); box-shadow: inset 0 0 0 1px var(--olive); }
.btn[disabled] { opacity: .55; cursor: wait; }

/* wishes */
.wish { display: grid; gap: 8px; justify-items: center; }
.wish + .wish { margin-top: 14px; }
.wish svg { width: 46px; height: 46px; color: rgba(251,247,238,.85); }
.wish h3 { margin: 0; font-family: var(--font-script); font-weight: 400; font-size: 1.8rem; line-height: 1.1; }
.wish p { margin: 0; max-width: 32ch; }

/* dress code */
.palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px; list-style: none; padding: 0; max-width: 320px; }
.palette li { width: 46px; height: 20px; border-radius: 40% 60% 55% 45% / 60% 40% 60% 40%; transform: rotate(-4deg); box-shadow: inset 0 -3px 6px rgba(0,0,0,.08); }
.palette li:nth-child(even) { transform: rotate(3deg); }

/* organiser */
.contact-name { font-weight: 600; }
.phone { font-size: 1.25rem; user-select: all; }
.socials { display: flex; gap: 14px; justify-content: center; }
.socials a { width: 44px; height: 44px; border-radius: 50%; background: var(--olive); color: var(--on-olive); display: grid; place-items: center; }
.socials a:hover, .socials a:focus-visible { background: var(--olive-deep); outline: none; }
.socials svg { width: 22px; height: 22px; }

/* heart quote */
.heart { position: relative; width: min(100%, 300px); aspect-ratio: 1 / .92; display: grid; place-items: center; }
.heart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.heart svg path:first-child { fill: var(--olive); }
.heart p { position: relative; color: var(--on-olive); font-size: 1rem; line-height: 1.4; padding: 14% 22% 22%; margin: 0; text-wrap: balance; }

/* questionnaire */
.rsvp { width: 100%; max-width: 380px; display: grid; gap: 22px; text-align: left; }
.rsvp[hidden] { display: none; }
.rsvp fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.rsvp legend, .rsvp label.q {
  font-family: var(--font-label); font-weight: 500; font-size: .72rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--gold); padding: 0; margin-bottom: 4px;
}
.choice { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 1.1rem; line-height: 1.35; }
.choice input { accent-color: var(--olive); width: 18px; height: 18px; margin: 3px 0 0; flex: none; }
.choices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 14px; }
.rsvp input[type="text"], .rsvp textarea {
  width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid rgba(75,74,54,.35); padding: 6px 2px; border-radius: 0;
}
.rsvp textarea { min-height: 72px; resize: vertical; border: 1px solid rgba(75,74,54,.3); padding: 8px 10px; border-radius: 10px; }
.rsvp input[type="text"]:focus, .rsvp textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 1px 0 var(--gold); }
.when-yes { display: grid; gap: 22px; }
.when-yes[hidden] { display: none; }
.actions { display: grid; justify-items: center; gap: 10px; }
.status { margin: 0; text-align: center; font-size: 1rem; color: var(--ink-soft); min-height: 1.4em; }
.status.err { color: #a2465a; }
.thanks { display: grid; gap: 6px; justify-items: center; }
.thanks[hidden] { display: none; }
.thanks p { margin: 0; }
.thanks .big { font-family: var(--font-script); font-size: 2rem; color: var(--olive-deep); }

.signature { font-family: var(--font-script); font-size: 1.6rem; color: var(--olive-deep); text-wrap: balance; }
.replay {
  background: none; border: 0; cursor: pointer; padding: 8px;
  font-family: var(--font-label); font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft);
}
.replay:focus-visible { outline: 2px solid var(--gold); }

/* question cards */
.rsvp { gap: 14px; }
.q-card {
  background: #fffdf8; border: 1px solid rgba(165,138,82,.28); border-radius: 14px;
  padding: 16px 16px 18px; display: grid; gap: 10px; min-width: 0;
  box-shadow: 0 6px 16px -12px rgba(75,74,54,.45);
}
.q-head { display: flex; align-items: center; gap: 12px; }
.q-head svg { width: 38px; height: 38px; flex: none; color: var(--gold); background: var(--paper-edge); border-radius: 50%; padding: 6px; }
.q-head .q-title { font-family: var(--font-serif); font-weight: 600; font-size: 1.12rem; line-height: 1.25; color: var(--ink); text-transform: none; letter-spacing: 0; margin: 0; padding: 0; }
.q-head .q-title small { display: block; font-weight: 400; font-style: italic; font-size: .92rem; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; cursor: pointer; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid rgba(124,130,87,.45); font-size: 1.02rem; line-height: 1.2; color: var(--ink);
  background: var(--paper); transition: background .2s, color .2s, border-color .2s;
}
.chip input:checked + span { background: var(--olive); border-color: var(--olive); color: var(--on-olive); }
.chip input:checked + span::before { content: "✓"; font-size: .9em; }
.chip input:focus-visible + span { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--gold); }
.attend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.attend .chip span { display: grid; justify-items: center; gap: 6px; text-align: center; border-radius: 14px; padding: 14px 8px; height: 100%; }
.attend .chip svg { width: 34px; height: 34px; color: var(--gold); }
.attend .chip input:checked + span svg { color: var(--on-olive); }
.attend .chip input:checked + span::before { content: none; }
.q-card input[type="text"], .q-card textarea { background: var(--paper); }
.when-yes { gap: 14px; }

/* dress code cards */
.dress-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.dress-card {
  background: #fffdf8; border: 1px solid rgba(165,138,82,.28); border-radius: 120px 120px 14px 14px;
  padding: 22px 12px 16px; display: grid; gap: 6px; justify-items: center; align-content: start; min-width: 0;
}
.dress-card svg { width: 76px; height: 96px; }
.dress-card h3 { margin: 0; font-family: var(--font-script); font-weight: 400; font-size: clamp(1.15rem, 5vw, 1.4rem); color: var(--olive-deep); }
.dress-card p { margin: 0; font-size: .98rem; line-height: 1.4; color: var(--ink-soft); }
@media (max-width: 380px) { .dress-cards { grid-template-columns: 1fr; } }

/* illustrations */
.manor { width: 100%; max-width: 380px; border-radius: 14px; overflow: hidden; display: block; box-shadow: 0 10px 24px -16px rgba(60,50,70,.6); }
.manor svg { display: block; width: 100%; height: auto; }
.avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--paper-edge); display: grid; place-items: center; color: var(--gold); box-shadow: inset 0 0 0 1px rgba(165,138,82,.35); }
.avatar svg { width: 46px; height: 46px; }
.wish { background: rgba(251,247,238,.08); border: 1px solid rgba(251,247,238,.25); border-radius: 16px; padding: 18px 16px; width: 100%; max-width: 360px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body class="sealed">
<canvas id="petals" aria-hidden="true"></canvas>
<main class="stage">

  <div class="envelope-wrap">
    <button class="envelope" id="envelope" type="button" aria-label="Открыть приглашение">
      {{ENVELOPE_SVG}}
      <span class="letter"><small>Приглашение</small><b>{{COUPLE_SHORT}}</b></span>
      {{ENVELOPE_FRONT}}
      {{ENVELOPE_FLAP}}
      <span class="seal">{{SEAL_SVG}}</span>
      <span class="envelope-to">
        <small>Лично в руки</small>
        <span>{{ENVELOPE_NAMES}}</span>
      </span>
    </button>
    <p class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5c0 3.6-2.4 6.5-6 6.5-2.5 0-3.8-1-5.3-3L4.4 14a1.5 1.5 0 0 1 2.3-1.9L9 14"/></svg>Нажмите на конверт</p>
  </div>

  <article class="card" id="card">
{{CONTENT}}
  </article>

</main>
<script>
(function () {
  var EVENT_DATE = {{EVENT_DATE}};
  var RSVP = {{RSVP_CONFIG}};
  var body = document.body;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var burst = function () {};

  function reveal() {
    if (!body.classList.contains('sealed')) return;
    if (reduce) { body.className = 'revealed'; burst(); return; }
    body.classList.add('opening');
    setTimeout(function () { body.classList.add('pulling'); }, 650);
    setTimeout(function () { body.classList.add('leaving'); }, 1750);
    setTimeout(function () { body.className = 'revealed'; burst(); window.scrollTo(0, 0); }, 2300);
  }
  document.getElementById('envelope').addEventListener('click', reveal);
  var replay = document.getElementById('replay');
  if (replay) replay.addEventListener('click', function () { body.className = 'sealed'; window.scrollTo(0, 0); });

  /* ---------- Countdown ---------- */
  var cd = document.getElementById('countdown');
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    if (!cd || !EVENT_DATE) return;
    var diff = new Date(EVENT_DATE) - new Date();
    if (isNaN(diff)) return;
    if (diff <= 0) {
      cd.innerHTML = '<p class="cd-done">' + (diff > -864e5 ? 'Этот день настал!' : 'Спасибо, что были с нами!') + '</p>';
      return;
    }
    var d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;
    var parts = [
      [d, plural(d, 'день', 'дня', 'дней')],
      [pad(h), plural(h, 'час', 'часа', 'часов')],
      [pad(m), plural(m, 'минута', 'минуты', 'минут')],
      [pad(s), plural(s, 'секунда', 'секунды', 'секунд')]
    ];
    cd.innerHTML = parts.map(function (p) {
      return '<div class="unit"><span class="num">' + p[0] + '</span><span class="lbl">' + p[1] + '</span></div>';
    }).join('<span class="sep">:</span>');
  }
  tick(); setInterval(tick, 1000);

  /* ---------- Questionnaire ---------- */
  var form = document.getElementById('rsvp');
  if (form) {
    var KEY = 'rsvp:' + RSVP.guest;
    var thanks = document.getElementById('rsvp-thanks');
    var status = form.querySelector('.status');
    var yesBlock = form.querySelector('.when-yes');
    function showThanks(coming) {
      form.hidden = true; thanks.hidden = false;
      thanks.querySelector('.big').textContent = coming ? 'Спасибо! Ждём Вас' : 'Спасибо за ответ';
      thanks.querySelector('.small').textContent = coming
        ? 'Ваш ответ получен. До встречи на празднике!'
        : 'Нам будет Вас не хватать. Спасибо, что сообщили.';
    }
    form.addEventListener('change', function () {
      var v = form.querySelector('input[name="attend"]:checked');
      if (yesBlock) yesBlock.hidden = !!(v && v.value === 'Не придёт');
    });
    try { var saved = localStorage.getItem(KEY); if (saved) showThanks(saved === 'yes'); } catch (e) {}
    document.getElementById('rsvp-again').addEventListener('click', function () {
      thanks.hidden = true; form.hidden = false; status.textContent = '';
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var attend = form.querySelector('input[name="attend"]:checked');
      if (!attend) { status.className = 'status err'; status.textContent = 'Отметьте, пожалуйста, сможете ли Вы прийти.'; return; }
      if (!RSVP.endpoint) {
        status.className = 'status err';
        status.textContent = 'Анкета ещё не подключена к таблице, поэтому ответ не отправлен.';
        return;
      }
      var fd = new FormData(form), params = new URLSearchParams();
      params.append('guest', RSVP.guest);
      fd.forEach(function (v, k) { if (k !== 'drinks') params.append(k, v); });
      params.append('drinks', fd.getAll('drinks').join(', '));
      var btn = form.querySelector('button[type="submit"]');
      btn.disabled = true; status.className = 'status'; status.textContent = 'Отправляем…';
      fetch(RSVP.endpoint, { method: 'POST', mode: 'no-cors', body: params })
        .then(function () {
          var yes = attend.value !== 'Не придёт';
          try { localStorage.setItem(KEY, yes ? 'yes' : 'no'); } catch (e) {}
          showThanks(yes);
        })
        .catch(function () {
          status.className = 'status err';
          status.textContent = 'Не получилось отправить. Проверьте интернет и попробуйте ещё раз.';
        })
        .then(function () { btn.disabled = false; });
    });
  }

  /* ---------- Falling petals ---------- */
  var canvas = document.getElementById('petals');
  var ctx = canvas.getContext && canvas.getContext('2d');
  if (!ctx || reduce) return;
  var W, H, dpr = Math.min(window.devicePixelRatio || 1, 2), petals = [], t0 = performance.now();
  // Палитры лепестков: [основание, середина, край]
  var TONES = [
    ['#e9a3b3', '#f6c9d2', '#fde9ee'],   // розовая роза
    ['#f1d7cf', '#fbebe5', '#fffaf7'],   // пудровая
    ['#e8e2d6', '#f8f5ee', '#ffffff'],   // белая
    ['#a998d4', '#c9bde8', '#ece6f8'],   // сирень
    ['#d98a9c', '#eeb3c0', '#fadde4'],   // тёмно-розовая
    ['#efd9b8', '#f9ecd8', '#fffaf0']    // кремовая
  ];
  // Заранее рисуем спрайты лепестков с градиентом, прожилками и бликом.
  function makeSprite(tone, kind) {
    var S = 96, c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d'); g.translate(S / 2, S / 2);
    var w = kind === 1 ? 26 : 32, h = 40;
    function shape() {
      g.beginPath();
      g.moveTo(0, h);                                     // основание
      g.bezierCurveTo(w * .9, h * .55, w * 1.15, -h * .35, w * .45, -h * .9);
      if (kind === 0) {                                    // лепесток розы с выемкой
        g.quadraticCurveTo(w * .2, -h * 1.02, 0, -h * .78);
        g.quadraticCurveTo(-w * .2, -h * 1.02, -w * .45, -h * .9);
      } else {
        g.quadraticCurveTo(0, -h * 1.12, -w * .45, -h * .9);
      }
      g.bezierCurveTo(-w * 1.15, -h * .35, -w * .9, h * .55, 0, h);
      g.closePath();
    }
    var grad = g.createRadialGradient(0, h * .8, 2, 0, -h * .2, h * 1.5);
    grad.addColorStop(0, tone[0]); grad.addColorStop(.45, tone[1]); grad.addColorStop(1, tone[2]);
    shape(); g.fillStyle = grad; g.fill();
    g.save(); shape(); g.clip();
    // затенение одного края — ощущение изгиба
    var side = g.createLinearGradient(-w, 0, w, 0);
    side.addColorStop(0, 'rgba(80,40,60,.18)'); side.addColorStop(.45, 'rgba(80,40,60,0)');
    side.addColorStop(.75, 'rgba(255,255,255,.25)'); side.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = side; g.fillRect(-S / 2, -S / 2, S, S);
    // прожилки
    g.strokeStyle = 'rgba(150,80,100,.13)'; g.lineWidth = .8;
    for (var v = -2; v <= 2; v++) {
      g.beginPath(); g.moveTo(0, h * .95);
      g.quadraticCurveTo(v * w * .18, 0, v * w * .3, -h * .8); g.stroke();
    }
    g.restore();
    shape(); g.strokeStyle = 'rgba(120,70,90,.12)'; g.lineWidth = .7; g.stroke();
    return c;
  }
  var sprites = [];
  TONES.forEach(function (tone) { sprites.push(makeSprite(tone, 0), makeSprite(tone, 1)); });

  function size() {
    W = canvas.width = innerWidth * dpr; H = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  }
  function petal(top) {
    var z = Math.random();                           // глубина: 0 далеко, 1 близко
    return {
      x: Math.random() * W, y: top ? -40 * dpr : Math.random() * H, z: z,
      s: (0.18 + z * 0.32) * dpr,                    // масштаб спрайта
      vy: (0.45 + z * 1.0) * dpr, vx: (Math.random() - .5) * .3 * dpr,
      sway: Math.random() * 6.28, swaySp: 0.008 + Math.random() * 0.012, swayAmp: (0.4 + Math.random() * 0.8) * dpr,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * 0.025,
      flip: Math.random() * 6.28, vflip: 0.02 + Math.random() * 0.04,   // кувырок в воздухе
      tilt: Math.random() * 6.28, vtilt: 0.01 + Math.random() * 0.02,
      img: sprites[(Math.random() * sprites.length) | 0],
      a: 0.55 + z * 0.4
    };
  }
  size(); addEventListener('resize', size);
  var COUNT = innerWidth < 600 ? 22 : 34;
  for (var i = 0; i < COUNT; i++) petals.push(petal(false));
  burst = function () { for (var i = 0; i < 30; i++) petals.push(petal(true)); };
  function draw(now) {
    var t = (now - t0) / 1000;
    var wind = (Math.sin(t * .23) * .6 + Math.sin(t * .71 + 1) * .3) * dpr;   // мягкие порывы
    ctx.clearRect(0, 0, W, H);
    for (var i = petals.length - 1; i >= 0; i--) {
      var p = petals[i];
      p.sway += p.swaySp; p.flip += p.vflip; p.tilt += p.vtilt; p.rot += p.vr;
      p.y += p.vy * (0.75 + 0.35 * Math.abs(Math.cos(p.flip)));               // плашмя падает медленнее
      p.x += p.vx + Math.sin(p.sway) * p.swayAmp + wind * (0.4 + p.z);
      if (p.y > H + 50 * dpr || p.x < -80 * dpr || p.x > W + 80 * dpr) {
        if (petals.length > COUNT) { petals.splice(i, 1); continue; }
        petals[i] = petal(true); if (wind > 0) petals[i].x -= W * .15; continue;
      }
      var sx = Math.cos(p.flip), sy = 0.55 + 0.45 * Math.cos(p.tilt);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.scale(p.s * (Math.abs(sx) < .08 ? .08 : sx), p.s * sy);
      ctx.globalAlpha = p.a * (0.75 + 0.25 * Math.abs(sx));                   // ребром чуть прозрачнее
      ctx.drawImage(p.img, -48, -48);
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
