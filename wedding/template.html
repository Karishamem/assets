<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Oswald:wght@300;400&family=Marck+Script&display=swap">
<style>
{{FONT_FACE}}
/* Layout: one blush-paper column over a black-and-white rain-soaked peony photo;
   wine-red inset blocks, satin bows on the edges, a wax-sealed envelope opens first. */
:root {
  --paper: #fbf3ef;
  --paper-2: #f2e4de;
  --wine: #8c1230;
  --wine-deep: #6c0c23;
  --ink: #1e1a1b;
  --ink-soft: #5c5355;
  --on-wine: #fff6f3;
  --tile: #171314;
  --font-script: "Allegretto Script One", "Marck Script", "Segoe Script", cursive;
  --font-body: "Comfortaa", "Trebuchet MS", Arial, sans-serif;
  --font-num: "Oswald", "Arial Narrow", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
::selection { background: #f0c9d2; color: var(--ink); }
html { scrollbar-color: var(--wine) #2a2627; caret-color: var(--wine); }
body {
  min-height: 100vh;
  background: #3a3637;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: .98rem;
  line-height: 1.65;
  padding: max(24px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
  overflow-x: hidden;
}
/* фото-фон держим в отдельном фиксированном слое: на iOS background-attachment: fixed не работает */
.photo-bg { position: fixed; inset: 0; z-index: 0; background: #3a3637 {{BG_IMAGE}} center / cover no-repeat; }
.photo-bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.35)); }
#petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.stage { position: relative; z-index: 2; max-width: 460px; margin: 0 auto; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* ---------- Envelope ---------- */
.envelope-wrap { display: grid; place-items: center; align-content: center; min-height: calc(100vh - 64px); gap: 26px; padding-top: 70px; }
.envelope {
  position: relative; width: min(100%, 420px); aspect-ratio: 420 / 290; max-width: 100%;
  border: 0; padding: 0; background: none; cursor: pointer; font: inherit; color: inherit;
  perspective: 1200px; filter: drop-shadow(0 26px 30px rgba(0,0,0,.45)) drop-shadow(0 3px 5px rgba(0,0,0,.3));
  transition: transform .4s ease;
}
.envelope:hover { transform: translateY(-3px) rotate(-.4deg); }
.envelope:focus-visible { outline: 2px solid var(--on-wine); outline-offset: 8px; border-radius: 6px; }
.envelope > * { position: absolute; display: block; }
.env-back, .env-front, .flap { inset: 0; width: 100%; height: 100%; }
.env-back { z-index: 0; }
.letter {
  left: 5%; right: 5%; top: 5%; height: 88%; z-index: 1;
  background: var(--paper); border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.15);
  display: grid; justify-items: center; align-content: start; padding-top: 6%; gap: 0;
  transition: transform 1s cubic-bezier(.3,.7,.2,1);
}
.letter small { font-family: var(--font-body); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
.letter b { font-family: var(--font-script); font-weight: 400; font-size: clamp(1.5rem, 6.4vw, 2rem); color: var(--wine); line-height: 1.3; }
.env-front { z-index: 2; pointer-events: none; }
.flap { z-index: 3; transform-origin: top center; transition: transform .7s cubic-bezier(.55,.05,.35,1); pointer-events: none; }
.seal { z-index: 4; left: 50%; top: 57%; width: 23%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(-8deg); transition: opacity .35s ease, transform .35s ease; }
.seal svg { width: 100%; height: 100%; display: block; overflow: visible; }
.env-bow { z-index: 5; left: -4%; top: -16%; width: 26%; transform: rotate(-18deg); transition: opacity .3s ease; }
.env-bow svg { width: 100%; height: auto; display: block; }
.envelope-to { z-index: 4; left: 8%; right: 8%; bottom: 7%; text-align: center; transition: opacity .3s ease; }
.envelope-to span { font-family: var(--font-script); font-size: clamp(1.35rem, 5.6vw, 1.8rem); line-height: 1.15; color: var(--wine-deep); }
.hint {
  margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
  background: rgba(23,19,20,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--on-wine);
  animation: breathe 2.4s ease-in-out infinite;
}
.hint svg { width: 18px; height: 18px; }
@keyframes breathe { 50% { opacity: .55; } }
body.opening .seal { opacity: 0; transform: translate(-50%, -30%) rotate(-8deg) scale(.7); }
body.opening .envelope-to, body.opening .env-bow { opacity: 0; }
body.opening .flap { transform: rotateX(178deg); }
body.opening .hint { visibility: hidden; }
body.pulling .flap { z-index: 0; }
body.pulling .letter { transform: translateY(-62%); }
body.leaving .envelope-wrap { animation: sink .6s ease forwards; }
@keyframes sink { to { opacity: 0; transform: translateY(24px) scale(.97); } }

/* ---------- Invitation column ---------- */
.card { position: relative; background: var(--paper); text-align: center; box-shadow: 0 30px 70px -20px rgba(0,0,0,.6); }
body.sealed .card { display: none; }
body.revealed .envelope-wrap { display: none; }
body.revealed .card { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

.panel { position: relative; padding: 40px clamp(18px, 6vw, 36px); display: grid; gap: 14px; justify-items: center; }
.panel > * { margin: 0; max-width: 100%; min-width: 0; }
h2 {
  font-family: var(--font-script); font-weight: 400; font-size: clamp(2.3rem, 9vw, 2.9rem);
  line-height: 1.2; color: var(--ink); text-wrap: balance;
}
h2::first-letter { color: var(--wine); font-size: 1.4em; }
.text { max-width: 34ch; font-size: .95rem; text-wrap: pretty; }
.text p { margin: 0 0 .6em; }
.text p:last-child { margin: 0; }

/* wine blocks */
.block {
  width: 100%; background: var(--wine); color: var(--on-wine); border-radius: 4px;
  padding: 30px 20px 40px; display: grid; gap: 12px; justify-items: center; position: relative;
  box-shadow: 0 14px 30px -18px rgba(108,12,35,.8);
}
.block > * { margin: 0; max-width: 100%; }
.block h2, .block h2::first-letter { color: var(--on-wine); }
.block .text + h2 { margin-top: 14px; }
.block .pill { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); }
.block + .block { margin-top: 30px; }
.pill {
  display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 26px; white-space: nowrap;
  border-radius: 999px; border: 1px solid var(--wine); background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: .85rem; text-decoration: none; cursor: pointer;
  box-shadow: 0 6px 14px -8px rgba(0,0,0,.5); transition: background .2s, color .2s;
}
.pill:hover, .pill:focus-visible { background: var(--wine-deep); color: var(--on-wine); outline: none; }
.pill:focus-visible { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--wine); }
.pill:active { transform: translateX(-50%) scale(.98); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 46px; border: 0; border-radius: 999px; padding: 10px 30px;
  font-family: var(--font-body); font-size: .9rem; color: var(--on-wine); background: var(--wine); cursor: pointer; transition: background .2s;
}
.btn:hover, .btn:focus-visible { background: var(--wine-deep); outline: none; }
.btn:focus-visible { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--wine); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--wine); box-shadow: inset 0 0 0 1px var(--wine); }
.btn[disabled] { opacity: .55; cursor: wait; }

/* bows */
.bow { position: absolute; width: 96px; z-index: 3; pointer-events: none; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
.bow svg { display: block; width: 100%; height: auto; }
.bow.left { left: -34px; top: -38px; transform: rotate(-14deg); }
.bow.right { right: -30px; bottom: -70px; transform: rotate(12deg); }

/* hero: guest names + photos */
.hero { padding-top: 34px; padding-bottom: 20px; justify-items: stretch; }
.hero .dear { text-align: left; font-family: var(--font-script); font-size: 1.6rem; color: var(--ink-soft); line-height: 1; }
.guest-names { font-family: var(--font-script); font-weight: 400; color: var(--ink); line-height: 1.05; display: grid; text-align: left; overflow-wrap: anywhere; }
.guest-names span { font-size: clamp(2rem, 8.8vw, 2.8rem); }
.guest-names span:nth-child(3) { padding-left: 14%; }
.guest-names i { font-style: normal; color: var(--wine); font-size: 1.6rem; padding-left: 12%; line-height: .6; }
.cap { color: var(--wine); font-size: 1.45em; line-height: .8; }
.loves { position: relative; margin: 18px calc(-1 * clamp(18px, 6vw, 36px)) 0; height: 300px; overflow: hidden; }
.loves .lines { position: absolute; inset: -40% -30%; transform: rotate(-14deg); display: grid; align-content: center; gap: 2px; }
.loves .lines span { white-space: nowrap; font-family: var(--font-script); font-size: 1.55rem; line-height: 1.5; color: var(--ink); opacity: .8; }
.loves .lines span:nth-child(odd) { margin-left: -60px; }
.photo {
  position: absolute; background: var(--wine-deep); overflow: hidden; border-radius: 3px;
  box-shadow: 0 16px 26px -12px rgba(0,0,0,.6); display: grid; place-items: center;
}
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo.p1 { left: 9%; top: 26px; width: 44%; height: 250px; transform: rotate(-2deg); }
.photo.p2 { right: 9%; top: 52px; width: 40%; height: 200px; transform: rotate(2.5deg); }
.photo .ph { color: var(--on-wine); font-family: var(--font-script); font-size: 2.6rem; line-height: 1; display: grid; justify-items: center; gap: 8px; }
.photo .ph svg { width: 34px; height: 34px; opacity: .8; }
.photo.p1 { background: linear-gradient(160deg, #a3203f, var(--wine-deep)); }
.photo.p2 { background: linear-gradient(200deg, #9a1a38, #5a0a1d); }

/* our day */
.month { font-family: var(--font-script); font-size: 1.5rem; line-height: 1; }
.year { font-size: .9rem; margin-top: -6px !important; }
.days { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 5vw, 24px); font-size: 1.1rem; }
.days .on { position: relative; width: 78px; height: 70px; display: grid; place-items: center; color: var(--on-wine); font-size: 1.6rem; }
.days .on svg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--wine); }
.days .on em { position: relative; font-style: normal; padding-bottom: 6px; }
.timeline { list-style: none; margin: -14px 0 0 !important; padding: 26px 0 10px; width: 100%; position: relative; display: grid; gap: 18px; }
.timeline::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--wine); opacity: .7; }
.timeline li { display: grid; grid-template-columns: 1fr 18px 1fr; align-items: end; column-gap: 10px; }
.timeline .heart { width: 14px; height: 14px; color: var(--wine); justify-self: center; align-self: center; position: relative; }
.timeline .heart svg { width: 100%; height: 100%; display: block; }
.timeline .item { display: grid; min-width: 0; }
.timeline li:nth-child(odd) .item { grid-column: 1; text-align: right; }
.timeline li:nth-child(odd) .heart { grid-column: 2; grid-row: 1; }
.timeline li:nth-child(even) .item { grid-column: 3; text-align: left; }
.timeline li:nth-child(even) .heart { grid-column: 2; grid-row: 1; }
.timeline time { color: var(--wine); font-size: .85rem; font-variant-numeric: tabular-nums; }
.timeline b { font-family: var(--font-script); font-weight: 400; font-size: 1.75rem; line-height: 1.05; }

/* location */
.venue { width: 100%; border-radius: 3px; overflow: hidden; display: block; margin-top: 6px; }
.venue img, .venue svg { width: 100%; display: block; height: auto; }

/* dress code */
.swatches { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 10px 12px; list-style: none; border: 1px solid var(--wine); border-radius: 8px; background: #fff; width: 100%; }
.swatches li { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }

/* countdown */
.countdown { justify-items: start; text-align: left; padding-bottom: 60px; }
.countdown h2 { text-align: left; max-width: 12ch; color: var(--wine); line-height: 1.05; }
.units { display: flex; justify-content: center; gap: 10px; width: 100%; }
.unit { display: grid; gap: 6px; justify-items: center; }
.num {
  min-width: 64px; padding: 6px 8px; border-radius: 6px; color: #fff; font-family: var(--font-num); font-weight: 300;
  font-size: 2.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; text-align: center;
  background: linear-gradient(var(--tile) 49.4%, #000 49.5%, #000 50.5%, #231d1f 50.6%);
  box-shadow: 0 6px 12px -6px rgba(0,0,0,.6);
}
.lbl { font-family: var(--font-script); font-size: 1.05rem; color: var(--wine); line-height: 1; }
.cd-done { font-family: var(--font-script); font-size: 2.4rem; color: var(--wine); }

.timeline small { display: block; font-size: .78rem; line-height: 1.45; color: var(--ink-soft); margin-top: 4px; }
.block .note { font-size: .85rem; opacity: .92; font-style: italic; }
.dress { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.dress-item { display: grid; justify-items: center; gap: 6px; align-content: start; padding: 18px 10px; border: 1px solid rgba(140,18,48,.35); border-radius: 999px 999px 10px 10px; background: #fff; min-width: 0; }
.dress-item svg { width: 44px; height: 44px; color: var(--wine); }
.dress-item h3 { margin: 0; font-family: var(--font-script); font-weight: 400; font-size: 1.7rem; line-height: 1.1; }
.dress-item h3::first-letter { color: var(--wine); }
.dress-item p { margin: 0; font-size: .85rem; line-height: 1.5; color: var(--ink-soft); }
.socials a.max { font-family: var(--font-body); font-weight: 600; font-size: .72rem; letter-spacing: .04em; text-decoration: none; }
@media (max-width: 360px) { .dress { grid-template-columns: 1fr; } }

/* organiser */
.phone { font-size: 1.1rem; user-select: all; }
.socials { display: flex; gap: 14px; justify-content: center; }
.socials a { width: 46px; height: 46px; border-radius: 50%; background: var(--wine); color: var(--on-wine); display: grid; place-items: center; }
.socials a:hover, .socials a:focus-visible { background: var(--wine-deep); outline: none; }
.socials a:active { transform: scale(.96); }
.socials svg { width: 22px; height: 22px; }

/* questionnaire */
.rsvp { width: 100%; display: grid; gap: 20px; text-align: left; }
.rsvp[hidden] { display: none; }
.q-card { display: grid; gap: 12px; min-width: 0; padding-top: 20px; border-top: 1px solid rgba(140,18,48,.25); }
.rsvp > .q-card:first-child { border-top: 0; padding-top: 0; }
.q-head { display: flex; align-items: center; gap: 12px; }
.q-head svg { width: 38px; height: 38px; flex: none; color: var(--wine); background: var(--paper-2); border-radius: 50%; padding: 7px; }
.q-title { margin: 0; font-weight: 600; font-size: .98rem; line-height: 1.35; color: var(--ink); }
.q-title small { display: block; font-weight: 400; font-size: .82rem; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; cursor: pointer; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 999px;
  border: 1px solid rgba(140,18,48,.45); font-size: .92rem; line-height: 1.2; color: var(--ink); background: #fff;
  transition: background .2s, color .2s, border-color .2s;
}
.chip:hover span { border-color: var(--wine); }
.chip:active span { transform: scale(.98); }
.chip .tick { display: none; width: 14px; height: 14px; }
.chip input:checked + span { background: var(--wine); border-color: var(--wine); color: var(--on-wine); }
.chip input:checked + span .tick { display: block; }
.chip input:focus-visible + span { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--wine); }
.attend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.attend .chip span { display: grid; justify-items: center; gap: 6px; text-align: center; border-radius: 10px; padding: 14px 8px; height: 100%; }
.attend .chip svg { width: 32px; height: 32px; color: var(--wine); }
.attend .chip input:checked + span svg { color: var(--on-wine); }
.attend .chip .tick { display: none !important; }
.rsvp input[type="text"], .rsvp textarea {
  width: 100%; font: inherit; font-size: .98rem; color: var(--ink); background: #fff;
  border: 1px solid rgba(140,18,48,.3); padding: 10px 12px; border-radius: 10px;
}
.rsvp textarea { min-height: 80px; resize: vertical; }
.rsvp input[type="text"]:focus, .rsvp textarea:focus { outline: none; border-color: var(--wine); box-shadow: 0 0 0 3px rgba(140,18,48,.15); }
.rsvp ::placeholder { color: var(--ink-soft); opacity: .8; }
.when-yes { display: grid; gap: 20px; }
.when-yes[hidden] { display: none; }
.actions { display: grid; justify-items: center; gap: 10px; }
.status { margin: 0; text-align: center; font-size: .9rem; color: var(--ink-soft); min-height: 1.4em; }
.status.err { color: var(--wine); }
.thanks { display: grid; gap: 6px; justify-items: center; }
.thanks[hidden] { display: none; }
.thanks p { margin: 0; }
.thanks .big { font-family: var(--font-script); font-size: 2.4rem; color: var(--wine); animation: beat 1.4s ease-out 1; }
@keyframes beat { 0% { transform: scale(.85); opacity: 0; } 40% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }

.signature { font-family: var(--font-script); font-size: 2rem; color: var(--wine); text-wrap: balance; line-height: 1.2; }
.replay {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; background: none; border: 0; cursor: pointer; padding: 8px 12px;
  font-family: var(--font-body); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
}
.replay svg { width: 16px; height: 16px; }
.replay:hover { color: var(--wine); }
.replay:focus-visible { outline: 2px solid var(--wine); }

@media (max-width: 380px) {
  .num { min-width: 54px; font-size: 2.2rem; }
  .bow { width: 78px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body class="sealed">
<div class="photo-bg" aria-hidden="true"></div>
<canvas id="petals" aria-hidden="true"></canvas>
<main class="stage">

  <div class="envelope-wrap">
    <button class="envelope" id="envelope" type="button" aria-label="Открыть приглашение">
      {{ENVELOPE_SVG}}
      <span class="letter"><small>Приглашение на свадьбу</small><b>{{COUPLE_SHORT}}</b></span>
      {{ENVELOPE_FRONT}}
      {{ENVELOPE_FLAP}}
      <span class="seal">{{SEAL_SVG}}</span>
      <span class="env-bow">{{BOW}}</span>
      <span class="envelope-to"><span>{{ENVELOPE_NAMES}}</span></span>
    </button>
    <p class="hint">{{HAND_ICON}}Нажмите на конверт</p>
  </div>

  <article class="card" id="card">
{{CONTENT}}
  </article>

</main>
<script>
(function () {
  var EVENT_DATE = {{EVENT_DATE}};
  var RSVP = {{RSVP_CONFIG}};
  var body = document.body;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var burst = function () {};

  function reveal() {
    if (!body.classList.contains('sealed')) return;
    if (reduce) { body.className = 'revealed'; burst(); return; }
    body.classList.add('opening');
    setTimeout(function () { body.classList.add('pulling'); }, 650);
    setTimeout(function () { body.classList.add('leaving'); }, 1750);
    setTimeout(function () { body.className = 'revealed'; burst(); window.scrollTo(0, 0); }, 2300);
  }
  document.getElementById('envelope').addEventListener('click', reveal);
  var replay = document.getElementById('replay');
  if (replay) replay.addEventListener('click', function () { body.className = 'sealed'; window.scrollTo(0, 0); });

  /* ---------- Countdown ---------- */
  var cd = document.getElementById('countdown');
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    if (!cd || !EVENT_DATE) return;
    var diff = new Date(EVENT_DATE) - new Date();
    if (isNaN(diff)) return;
    if (diff <= 0) {
      cd.innerHTML = '<p class="cd-done">' + (diff > -864e5 ? 'Этот день настал!' : 'Спасибо, что были с нами!') + '</p>';
      return;
    }
    var d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1e3) % 60;
    var parts = [
      [pad(d), plural(d, 'день', 'дня', 'дней')],
      [pad(h), plural(h, 'час', 'часа', 'часов')],
      [pad(m), plural(m, 'минута', 'минуты', 'минут')],
      [pad(s), plural(s, 'секунда', 'секунды', 'секунд')]
    ];
    cd.innerHTML = parts.map(function (p) {
      return '<div class="unit"><span class="num">' + p[0] + '</span><span class="lbl">' + p[1] + '</span></div>';
    }).join('');
  }
  tick(); setInterval(tick, 1000);

  /* ---------- Questionnaire ---------- */
  var form = document.getElementById('rsvp');
  if (form) {
    var KEY = 'rsvp:' + RSVP.guest;
    var thanks = document.getElementById('rsvp-thanks');
    var status = form.querySelector('.status');
    var yesBlock = form.querySelector('.when-yes');
    function showThanks(coming) {
      form.hidden = true; thanks.hidden = false;
      thanks.querySelector('.big').textContent = coming ? 'Спасибо! Ждём Вас' : 'Спасибо за ответ';
      thanks.querySelector('.small').textContent = coming
        ? 'Ваш ответ получен. До встречи на празднике!'
        : 'Нам будет Вас не хватать. Спасибо, что сообщили.';
    }
    form.addEventListener('change', function () {
      var v = form.querySelector('input[name="attend"]:checked');
      if (yesBlock) yesBlock.hidden = !!(v && v.value === 'Не придёт');
    });
    try { var saved = localStorage.getItem(KEY); if (saved) showThanks(saved === 'yes'); } catch (e) {}
    document.getElementById('rsvp-again').addEventListener('click', function () {
      thanks.hidden = true; form.hidden = false; status.textContent = '';
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var attend = form.querySelector('input[name="attend"]:checked');
      if (!attend) { status.className = 'status err'; status.textContent = 'Отметьте, пожалуйста, сможете ли Вы прийти.'; return; }
      if (!RSVP.endpoint) {
        status.className = 'status err';
        status.textContent = 'Анкета ещё не подключена к таблице, поэтому ответ не отправлен.';
        return;
      }
      var fd = new FormData(form), params = new URLSearchParams();
      params.append('guest', RSVP.guest);
      fd.forEach(function (v, k) { if (k !== 'drinks') params.append(k, v); });
      params.append('drinks', fd.getAll('drinks').join(', '));
      var btn = form.querySelector('button[type="submit"]');
      btn.disabled = true; status.className = 'status'; status.textContent = 'Отправляем…';
      fetch(RSVP.endpoint, { method: 'POST', mode: 'no-cors', body: params })
        .then(function () {
          var yes = attend.value !== 'Не придёт';
          try { localStorage.setItem(KEY, yes ? 'yes' : 'no'); } catch (e) {}
          showThanks(yes);
          if (yes) burst();
        })
        .catch(function () {
          status.className = 'status err';
          status.textContent = 'Не получилось отправить. Проверьте интернет и попробуйте ещё раз.';
        })
        .then(function () { btn.disabled = false; });
    });
  }

  /* ---------- Falling petals ---------- */
  var canvas = document.getElementById('petals');
  var ctx = canvas.getContext && canvas.getContext('2d');
  if (!ctx || reduce) return;
  var W, H, dpr = Math.min(window.devicePixelRatio || 1, 2), petals = [], t0 = performance.now();
  // Палитры лепестков: [основание, середина, край]
  var TONES = [
    ['#5e0a1c', '#8c1230', '#b8344f'],   // бордовая роза
    ['#7a0f27', '#a51d3c', '#cf5a72'],   // красная
    ['#b23a55', '#e08a9c', '#f7cfd8'],   // розовая
    ['#e8ddd8', '#f7f0ec', '#ffffff'],   // белая
    ['#4a0816', '#73102a', '#9c2440']    // тёмное вино
  ];
  // Заранее рисуем спрайты лепестков с градиентом, прожилками и бликом.
  function makeSprite(tone, kind) {
    var S = 96, c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d'); g.translate(S / 2, S / 2);
    var w = kind === 1 ? 26 : 32, h = 40;
    function shape() {
      g.beginPath();
      g.moveTo(0, h);
      g.bezierCurveTo(w * .9, h * .55, w * 1.15, -h * .35, w * .45, -h * .9);
      if (kind === 0) {
        g.quadraticCurveTo(w * .2, -h * 1.02, 0, -h * .78);
        g.quadraticCurveTo(-w * .2, -h * 1.02, -w * .45, -h * .9);
      } else {
        g.quadraticCurveTo(0, -h * 1.12, -w * .45, -h * .9);
      }
      g.bezierCurveTo(-w * 1.15, -h * .35, -w * .9, h * .55, 0, h);
      g.closePath();
    }
    var grad = g.createRadialGradient(0, h * .8, 2, 0, -h * .2, h * 1.5);
    grad.addColorStop(0, tone[0]); grad.addColorStop(.45, tone[1]); grad.addColorStop(1, tone[2]);
    shape(); g.fillStyle = grad; g.fill();
    g.save(); shape(); g.clip();
    var side = g.createLinearGradient(-w, 0, w, 0);
    side.addColorStop(0, 'rgba(30,0,10,.25)'); side.addColorStop(.45, 'rgba(30,0,10,0)');
    side.addColorStop(.75, 'rgba(255,255,255,.22)'); side.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = side; g.fillRect(-S / 2, -S / 2, S, S);
    g.strokeStyle = 'rgba(40,0,10,.14)'; g.lineWidth = .8;
    for (var v = -2; v <= 2; v++) {
      g.beginPath(); g.moveTo(0, h * .95);
      g.quadraticCurveTo(v * w * .18, 0, v * w * .3, -h * .8); g.stroke();
    }
    g.restore();
    shape(); g.strokeStyle = 'rgba(40,0,10,.15)'; g.lineWidth = .7; g.stroke();
    return c;
  }
  var sprites = [];
  TONES.forEach(function (tone) { sprites.push(makeSprite(tone, 0), makeSprite(tone, 1)); });

  function size() {
    W = canvas.width = innerWidth * dpr; H = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  }
  function petal(top) {
    var z = Math.random();
    return {
      x: Math.random() * W, y: top ? -40 * dpr : Math.random() * H, z: z,
      s: (0.18 + z * 0.32) * dpr,
      vy: (0.45 + z * 1.0) * dpr, vx: (Math.random() - .5) * .3 * dpr,
      sway: Math.random() * 6.28, swaySp: 0.008 + Math.random() * 0.012, swayAmp: (0.4 + Math.random() * 0.8) * dpr,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * 0.025,
      flip: Math.random() * 6.28, vflip: 0.02 + Math.random() * 0.04,
      tilt: Math.random() * 6.28, vtilt: 0.01 + Math.random() * 0.02,
      img: sprites[(Math.random() * sprites.length) | 0],
      a: 0.6 + z * 0.4
    };
  }
  size(); addEventListener('resize', size);
  var COUNT = innerWidth < 600 ? 20 : 32;
  for (var i = 0; i < COUNT; i++) petals.push(petal(false));
  burst = function () { for (var i = 0; i < 30; i++) petals.push(petal(true)); };
  function draw(now) {
    var t = (now - t0) / 1000;
    var wind = (Math.sin(t * .23) * .6 + Math.sin(t * .71 + 1) * .3) * dpr;
    ctx.clearRect(0, 0, W, H);
    for (var i = petals.length - 1; i >= 0; i--) {
      var p = petals[i];
      p.sway += p.swaySp; p.flip += p.vflip; p.tilt += p.vtilt; p.rot += p.vr;
      p.y += p.vy * (0.75 + 0.35 * Math.abs(Math.cos(p.flip)));
      p.x += p.vx + Math.sin(p.sway) * p.swayAmp + wind * (0.4 + p.z);
      if (p.y > H + 50 * dpr || p.x < -80 * dpr || p.x > W + 80 * dpr) {
        if (petals.length > COUNT) { petals.splice(i, 1); continue; }
        petals[i] = petal(true); if (wind > 0) petals[i].x -= W * .15; continue;
      }
      var sx = Math.cos(p.flip), sy = 0.55 + 0.45 * Math.cos(p.tilt);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.scale(p.s * (Math.abs(sx) < .08 ? .08 : sx), p.s * sy);
      ctx.globalAlpha = p.a * (0.75 + 0.25 * Math.abs(sx));
      ctx.drawImage(p.img, -48, -48);
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
